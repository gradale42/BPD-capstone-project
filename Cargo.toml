[package]
name = "bitcoin_dashboard"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
name = "bitcoin_dashboard"

[[bin]]
path = "src/main.rs"
name = "bitcoin_dashboard"

[dev-dependencies]
reqwest = "0.11"

[dependencies]
bitcoincore-rpc = "0.19.0"
bitcoin = "0.32.0"
serde = "1.0"
serde_json = "1.0"
actix-web = "4.13.0"
actix-files = "0.6.10"
chrono = { version = "0.4.44", features = ["serde"] }
config = "0.15.22"
dashmap = "7.0.0-rc2"
async-trait = "0.1.89"
uuid = { version = "1.23.0", features = ["v4", "serde"] }
tokio = "1.50.0"
futures = "0.3.32"

[dependencies.sqlx]
version = "0.8.6"
default-features = false
features = [
    "runtime-actix-rustls",
    "runtime-tokio",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "json"
]
