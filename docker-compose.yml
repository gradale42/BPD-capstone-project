services:
  bitcoind:
    image: lncm/bitcoind:v25.0
    container_name: bitcoind
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=alice
      - -rpcpassword=password
      - -fallbackfee=0.0001
    ports:
      - "18443:18443" # RPC
      - "18444:18444" # P2P
    volumes:
      - bitcoin-data:/home/bitcoin/.bitcoin
    networks:
      - bpd-network

volumes:
  bitcoin-data:
  alice-data:
  bob-data:
  carol-data:

networks:
  bpd-network:
    driver: bridge
